# MKTBOARD.AR · proceso diario
# Corre de lunes a viernes a las 19:00 de Buenos Aires (22:00 UTC) y cuando lo disparás a mano.
name: mktboard-diario

on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write   # para poder guardar data/contexto.json y data/historial.csv

concurrency:
  group: mktboard-diario
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-24.04   # fijo: ubuntu-latest pasa a 26.04 desde el 19/10/2026
    timeout-minutes: 25
    steps:
      - name: Bajar el repositorio
        uses: actions/checkout@v7
        with:
          ref: main          # la versión más nueva al arrancar, no la del momento en que se pidió la corrida

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Correr el proceso
        run: python pipeline/mktboard_diario.py

      - name: Guardar los resultados
        run: |
          git config user.name "mktboard-bot"
          git config user.email "mktboard-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git commit -m "datos $(date -u +%F)"
          for intento in 1 2 3; do
            if git push; then exit 0; fi
            echo "El repositorio cambió mientras corría: traigo lo nuevo y reintento ($intento/3)."
            # en un rebase, "theirs" es el commit propio: quedan los datos recién calculados
            git pull --rebase -X theirs origin main || { git rebase --abort; git pull --no-rebase -X ours origin main; }
            sleep 5
          done
          exit 1
